# render.yaml
services:
  - type: web
    name: personal-portfolio-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: RESEND_API_KEY
        sync: false          # Injected via Render dashboard secret
      - key: GITHUB_USERNAME
        value: myrson2
      - key: CACHE_TTL
        value: "900"         # 15 minutes
    healthCheckPath: /api/health

